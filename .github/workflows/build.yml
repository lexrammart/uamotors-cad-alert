name: Compilar EXE para Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install watchdog requests pyinstaller

      - name: Compilar ejecutable
        run: |
          pyinstaller -n uamotors_cad_alert --noconsole --onefile main.py

      - name: Crear INSTALAR.bat automáticamente
        shell: powershell
        run: |
          $batContent = @"
          @echo off
          echo Configurando alertas de CAD para UAMOTORS...
          powershell -Command "Unblock-File -Path '%~dp0uamotors_cad_alert.exe'" 2>nul
          start "" "%~dp0uamotors_cad_alert.exe"
          echo.
          echo ============================================
          echo   Instalador iniciado. Revisa la ventana
          echo   emergente para confirmar la instalacion.
          echo ============================================
          timeout /t 3
          "@
          Set-Content -Path "dist\INSTALAR.bat" -Value $batContent

      - name: Subir artefacto (.zip con instalador)
        uses: actions/upload-artifact@v4
        with:
          name: UAMOTORS_CAD_Instalador
          path: |
            dist/uamotors_cad_alert.exe
            dist/INSTALAR.bat
