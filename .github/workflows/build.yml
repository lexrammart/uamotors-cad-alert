name: Compilar EXE para Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install watchdog requests pyinstaller

      - name: Compilar ejecutable
        run: |
          pyinstaller --noconsole --onefile uamotors_cad_alert.py
          copy INSTALAR.bat dist\INSTALAR.bat

      - name: Subir artefacto (.zip con instalador)
        uses: actions/upload-artifact@v4
        with:
          name: UAMOTORS_CAD_Instalador
          path: |
            dist/uamotors_cad_alert.exe
            dist/INSTALAR.bat
