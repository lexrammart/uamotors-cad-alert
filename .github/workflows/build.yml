name: Compilar EXE para Windows

on:
  push:
    branches: [ main, master, feat/*, csharp-* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore src/UAMotorsCADAlert/UAMotorsCADAlert.csproj

      - name: Compilar ejecutable (Single File)
        run: dotnet publish src/UAMotorsCADAlert/UAMotorsCADAlert.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/

      - name: Crear INSTALAR.bat automáticamente
        shell: powershell
        run: |
          $batContent = @"
          @echo off
          echo Cerrando versiones anteriores...
          taskkill /F /IM UAMotorsCADAlert.exe 2>nul
          echo Desbloqueando ejecutable...
          powershell -Command "Unblock-File -Path '%~dp0UAMotorsCADAlert.exe'" 2>nul
          echo Instalando nueva version...
          start "" "%~dp0UAMotorsCADAlert.exe"
          "@
          Set-Content -Path "dist\INSTALAR.bat" -Value $batContent

      - name: Subir artefacto (.zip con instalador)
        uses: actions/upload-artifact@v4
        with:
          name: UAMOTORS_CAD_Instalador
          path: |
            dist/UAMotorsCADAlert.exe
            dist/INSTALAR.bat
            INSTRUCCIONES_INSTALACION.txt
